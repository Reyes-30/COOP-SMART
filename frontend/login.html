<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COOP-SMART - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Logo y Título -->
            <div class="logo-section">
                <div class="logo-icon">🏦</div>
                <h1 class="title">COOP-SMART</h1>
                <p class="subtitle">Sistema de Gestión para Cooperativas</p>
            </div>

            <!-- Formulario -->
            <form class="login-form" id="loginForm">
                <!-- Input Usuario -->
                <div class="form-group">
                    <label for="username" class="form-label">Usuario</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input 
                            type="text" 
                            id="username" 
                            class="form-input"
                            placeholder="Ingresa tu usuario"
                            required
                        >
                    </div>
                </div>

                <!-- Input Contraseña -->
                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input"
                            placeholder="Ingresa tu contraseña"
                            required
                        >
                        <button type="button" class="toggle-password" id="togglePassword">
                            <span id="eyeIcon">👁</span>
                        </button>
                    </div>
                </div>

                <!-- Checkbox Recordarme -->
                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember" class="checkbox-input">
                        <span class="checkbox-text">Recordarme</span>
                    </label>
                </div>

                <!-- Botón Iniciar Sesión -->
                <button type="submit" class="btn-primary">
                    INICIAR SESIÓN
                </button>

                <!-- Link Olvidaste Contraseña -->
                <a href="#" class="forgot-password">
                    ¿Olvidaste tu contraseña?
                </a>
            </form>

            <!-- Mensaje de Error (oculto por defecto) -->
            <div class="alert alert-error" id="errorAlert" style="display: none;">
                <span class="alert-icon">⚠️</span>
                <span class="alert-message">Credenciales inválidas</span>
            </div>

            <!-- Mensaje de Éxito (oculto por defecto) -->
            <div class="alert alert-success" id="successAlert" style="display: none;">
                <span class="alert-icon">✅</span>
                <span class="alert-message">¡Inicio de sesión exitoso!</span>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
